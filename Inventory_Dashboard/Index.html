<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Inventory Dashboard</h1>

  <!-- FORM -->
  <form class="form">

    <div class="form-group">
      <label for="name">Product Name</label>
      <input id="name" type="text" placeholder="Enter Name" required>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input id="quantity" type="number" min="0" placeholder="Enter Quantity" required>
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input id="price" type="number" min="0" placeholder="Enter Price" required>
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input id="category" type="text" placeholder="Enter Category" required>
    </div>

    <button type="submit">Add Product</button>

  </form>

  <!-- STATS -->
  <div class="stats">
    <div class="card">
      <h3>Total Items</h3>
      <p id="totalItems">0</p>
    </div>

    <div class="card">
      <h3>Total Value</h3>
      <p id="totalValue">Rs 0</p>
    </div>

    <div class="card">
      <h3>Low Stock</h3>
      <p id="lowStock">0</p>
    </div>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Category</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
